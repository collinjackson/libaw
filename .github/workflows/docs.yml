name: docs
# Rebuild and publish the docs site (https://collinjackson.github.io/libaw/) on every push to main.
# The rules tables are regenerated from data/ first, so the site always matches the engine.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate the rules tables and check links
        run: |
          UPDATE_DOCS=1 cargo test -p libaw --test rules_tables
          cargo test -p libaw --test docs_links
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          ./mdbook --version
      - run: ./mdbook build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
