name: ci
on:
  push:
  schedule:
    - cron: "17 9 * * *"   # nightly, 09:17 UTC
  workflow_dispatch:
jobs:
  build-and-selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - name: Self-play smoke test (fails on step errors or broken invariants)
        run: |
          mkdir -p out/logs out/games
          for f in docs/eval-harness/test-states/*.json; do
            SELFPLAY_LOG_DIR=out/logs ./target/release/awbw-replay --selfplay "$f" 2 | tee -a out/selfplay.txt
          done
      - name: Game viewer pages
        run: |
          for f in out/logs/*.json; do python3 -I tools/viewer.py "$f" "out/games/$(basename "$f" .json).html"; done
      - uses: actions/upload-artifact@v4
        with:
          name: games-${{ github.sha }}
          path: |
            out/games
            out/selfplay.txt
          retention-days: 14
  replay-fidelity:
    # Engine vs recorded AWBW games (private awbw-engine-data repo, read by deploy key).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # the nightly run appends to metrics/history.jsonl
    env:
      HAS_DATA_KEY: ${{ secrets.DATA_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip note
        if: env.HAS_DATA_KEY != 'true'
        run: echo "::warning::DATA_DEPLOY_KEY secret not set; replay fidelity check skipped"
      - uses: actions/checkout@v4
        if: env.HAS_DATA_KEY == 'true'
        with:
          repository: collinjackson/awbw-engine-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: corpus
      - uses: dtolnay/rust-toolchain@stable
        if: env.HAS_DATA_KEY == 'true'
      - uses: Swatinem/rust-cache@v2
        if: env.HAS_DATA_KEY == 'true'
      - name: Replay check (fails on regression vs metrics/baseline.json)
        if: env.HAS_DATA_KEY == 'true'
        shell: bash   # -eo pipefail, so a failure before tee fails the step
        env:
          AWBW_DATA: ${{ github.workspace }}/corpus
          AWBW_TEAM: ${{ github.workspace }}/corpus/data
        run: |
          (cd corpus && tar xzf packed/replays.tgz --warning=no-unknown-keyword && tar xzf packed/team.tgz --warning=no-unknown-keyword)
          python3 -I tools/metrics.py --check | tee metrics-run.txt
      - name: "Nightly: append to metrics history"
        if: env.HAS_DATA_KEY == 'true' && github.event_name == 'schedule'
        env:
          AWBW_DATA: ${{ github.workspace }}/corpus
          AWBW_TEAM: ${{ github.workspace }}/corpus/data
        run: |
          python3 -I tools/metrics.py
          git config user.name "awbw-engine CI"
          git config user.email "actions@users.noreply.github.com"
          git add metrics/history.jsonl
          git commit -m "Nightly metrics" && git pull --rebase && git push
