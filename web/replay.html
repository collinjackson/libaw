<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>libaw replay</title>
<link rel="stylesheet" href="style.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px system-ui, sans-serif; }
  .stage { max-width: 960px; margin: 16px auto; padding: 0 16px; }
  .screen { position: relative; overflow: hidden; border-radius: 12px; background: #10141c; }
  .screen svg { display: block; width: 100%; height: auto; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .tip { position: absolute; pointer-events: none; transform: translate(-50%, calc(-100% - 4px)); background: rgba(16, 20, 28, .92);
    color: #f7f8fa; font: 600 12px system-ui, sans-serif; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .tip[hidden] { display: none; }
  .tip { display: flex; align-items: center; gap: 4px; }
  .screen .tip svg.ico { width: auto !important; height: auto !important; display: block; flex: none; image-rendering: pixelated; }
  .tip .dim { color: #9aa3b2; font-weight: 500; }
  .tip .stars { color: #f2c94c; letter-spacing: -1px; }
  .controls { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  .controls input[type=range] { flex: 1; min-width: 120px; }
  .fx-hit { fill: #fff6b0; stroke: #ffb020; stroke-width: 3; }
  .fx-boom { fill: #ffb020; stroke: #e5603b; stroke-width: 4; }
  .fx-build { fill: none; stroke: #fff; stroke-width: 3; }
  .fx-shot { fill: #fff; stroke: #ffb020; stroke-width: 2; }
  .fx-flashw { fill: #fff; } .fx-ring { fill: none; stroke: #fff6b0; stroke-width: 4; }
  .fx-fire { fill: #ff8a1f; } .fx-core { fill: #fff3a0; } .fx-smoke { fill: #5a5550; }
  .fx-debris { fill: #2b2622; stroke: #ffb020; stroke-width: 1; }
  .fx-stem { fill: #e8701e; } .fx-cloud { fill: #ff9a2a; } .fx-cloud-cool { fill: #6d655d; }
  .fx-tracer { stroke: #ffe27a; stroke-width: 3; stroke-linecap: round; } .fx-puff { fill: #3d3a38; }
  .fx-billow { fill: #4a3d36; } .fx-crack { fill: none; stroke: #ff8a2a; stroke-width: 3; stroke-linecap: round; }
  .fx-area { fill: #fff3a0; }
  .fx-spark { stroke: #ffe27a; stroke-width: 2.5; stroke-linecap: round; }
  .hpbar { fill: #0b0d12; opacity: .85; } .hpseg.hi { fill: #6fdc8c; } .hpseg.mid { fill: #f2d23a; } .hpseg.lo { fill: #ff6a4a; } .hpseg.off { fill: #3a3f4a; }
  .fx-dmg { fill: #fff; stroke: #000; stroke-width: 3; paint-order: stroke; font: 900 18px system-ui, sans-serif; text-anchor: middle; }
  .fx-cap { fill: #fff; stroke: #000; stroke-width: 3; paint-order: stroke; font: 900 15px system-ui, sans-serif; text-anchor: middle; }
  .fx-cap.done { fill: #f2b53a; font-size: 13px; }
  .fx-power-bar { fill: #000; }
  .fx-power { fill: #f2b53a; font: 900 30px system-ui, sans-serif; text-anchor: middle; }
  body.capture .stage { margin: 0; padding: 0; max-width: none; } body.capture .controls, body.capture .meta { display: none; }
  body.capture .screen { border-radius: 0; }
</style>
</head>
<body>
<div id="sprites" hidden></div>
<div class="stage">
  <p class="meta" id="meta">Loading…</p>
  <div class="screen" id="screen"><svg id="board"></svg><div class="tip" id="tip" hidden></div></div>
  <div class="controls">
    <button id="btn-play">Play</button>
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <label><input id="camera" type="checkbox"> Follow the action</label>
    <select id="art"><option value="libaw">libaw art</option><option value="awbw">AWBW art</option></select>
    <label><input id="anim" type="checkbox" checked> Animate</label>
    <select id="shoals"><option value="custom">Custom shoals</option><option value="classic">Classic shoals</option></select>
    <label><input id="hp" type="checkbox"> HP bars</label>
  </div>
</div>
<script type="module">
import { Replay, GHOST } from './js/replay.js';
import { awbwLook } from './js/look.js';
import { TILE } from './js/board.js';
import { key, displayHp, hpUnknown, unitsByTile, buildingsByTile, terrainAt } from './js/logic.js';
import { spriteId, AWBW_COUNTRIES } from './js/art.js';
import { segmentAt } from './js/story.js';

// ?sb=URL of a storyboard (awbw-replay --storyboard TURN.json), &art=libaw|awbw, &camera=1,
// &anim=0 (AWBW's still sprites), &shoals=custom|classic, &water=URL of a sea/shoal tile table
// (js/look.js; custom shoals need it), &hp=bars (segmented HP bars), &cap=numbers (capture points
// drawn on buildings; otherwise a capturing unit's C badge, with the count on hover),
// &pad=even (as much room below the board as above it, for tall sprites),
// &ghost=1 (act out each step first, as the player's cursor and menus would: docs/replay-viewer.md),
// &ghostpace=K (the ghost's segments K times as long: 0.5 twice as fast, 0 none),
// &face=sides (AWBW art: first seat faces right, second left, instead of each country's own way),
// &capture=1 (no controls; window.__replay.renderAt(t) for web/capture.mjs).
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
if (q.get('capture')) document.body.classList.add('capture');
if (!q.get('sb')) { $('meta').textContent = 'Add ?sb=URL of a storyboard (docs/storyboard.md).'; throw new Error('no storyboard'); }
let [units, terrain, tmap, sprites, sb] = await Promise.all([
  fetch('../data/units.json').then((r) => r.json()),
  fetch('../data/terrain.json').then((r) => r.json()),
  fetch('assets/terrain-map.json').then((r) => r.json()),
  fetch('assets/sprites.svg').then((r) => r.text()),
  fetch(q.get('sb')).then((r) => r.json()),
]);
$('sprites').innerHTML = sprites;
// ?armies=bm,os: draw each seat (in turn order) as that AWBW army instead of its own, as AWBW's
// own army override does for players who can't tell two armies' colours apart. Blank keeps one.
const armies = (q.get('armies') ?? '').split(',').map((c) => c.trim().toLowerCase());
const armed = (s) => !armies.some((c) => AWBW_COUNTRIES[c]) ? s : { ...s, countries: { ...s.countries,
  ...Object.fromEntries(s.start.players.map((p, i) => [p.id, armies[i]]).filter(([, c]) => AWBW_COUNTRIES[c])) } };
$('art').value = q.get('art') || 'libaw';
$('camera').checked = !!q.get('camera');
$('anim').checked = q.get('anim') !== '0';
$('shoals').value = q.get('shoals') === 'classic' ? 'classic' : 'custom';
$('hp').checked = q.get('hp') === 'bars';
const water = q.get('water') ? await fetch(q.get('water')).then((r) => r.json()).catch(() => null) : null;
const name = (id) => sb.names?.[id] ?? `Player ${id}`;

let rp, stop = null, ghostPace = q.has('ghostpace') ? Math.max(0, Number(q.get('ghostpace')) || 0) : 1;
async function setup(t0 = 0) {
  if (stop) stop();
  const hover = rp?.board.hoverTile ?? null;
  rp?.board.destroy();
  const art = $('art').value === 'awbw' ? awbwLook(armed(sb), { animate: $('anim').checked, shoals: $('shoals').value, water, sides: q.get('face') === 'sides' }) : null;
  rp = new Replay($('board'), sb, { data: { units, terrain, tmap }, art, camera: $('camera').checked, hpBars: $('hp').checked, capCounts: q.get('cap') === 'numbers', ghost: q.get('ghost') === '1', ghostPace, even: q.get('pad') === 'even' });
  if (rp.ghost) loadEngine().catch(() => null);
  // AWBW's top-row sprites stand above the board: learn their heights before the first frame,
  // so the board (and a capture's frame size) has room for them from the start.
  await rp.board.measureArt(rp.states);
  if (rp.ghost) {
    const when = { early: true };
    await Promise.race([ghostRanges(rp, when), new Promise((ok) => setTimeout(ok, 2500))]);
    when.early = false;   // from here on the timeline stays as it is
  }
  hookTip();
  if (hover) { rp.board.hoverTile = hover; rp.board.hoverKey = `${hover[0]},${hover[1]}`; }
  $('meta').textContent = `Day ${sb.day}, ${name(sb.player)}'s turn: ${sb.steps.length} steps, ${rp.duration.toFixed(1)} s`;
  renderAt(t0);
}
let lastT = 0, idleTimer = null;
function renderAt(t) {
  lastT = t; checkSelection();
  // The ghost's cursor hides a few seconds after the turn's last step is drawn (and comes back
  // with the next frame before the end: a turn that grew, a scrub).
  clearTimeout(idleTimer); rp.idle = false;
  if (rp.ghost && t >= rp.duration) idleTimer = setTimeout(() => { rp.idle = true; rp.renderAt(lastT); }, GHOST.idle * 1000);
  rp.renderAt(t); $('scrub').value = Math.round((1000 * t) / rp.duration); showTip();
}
// Hover (or tap) a tile for what the board doesn't spell out: where it is, a unit's HP, a capture's points left.
let tipAt = null;
function showTip() {
  const tip = $('tip'), st = rp?.board.state;
  const nodes = tipAt && st && !sel ? tipNodes(st, ...tipAt) : null;   // not over a unit's ranges
  tip.hidden = !nodes;
  if (!nodes) return;
  tip.replaceChildren(...nodes);
  const m = $('board').getScreenCTM(), box = $('screen').getBoundingClientRect();
  if (!m) return;
  const pt = new DOMPoint((tipAt[0] + 0.5) * TILE, tipAt[1] * TILE).matrixTransform(m);
  const half = tip.offsetWidth / 2 + 2;   // kept inside the board at its edges
  tip.style.left = `${Math.min(Math.max(pt.x - box.left, half), Math.max(half, box.width - half))}px`;
  tip.style.top = `${Math.max(pt.y - box.top, tip.offsetHeight + 4)}px`;
}
// As on AWBW's hover, in pictures: the unit (and what a transport carries) and the tile under it
// (a big sprite like a Mega Tank's hides it) with its defence stars. The art's colours say whose
// they are. Drawn with the board's own art.
const SVGNS = 'http://www.w3.org/2000/svg';
function icon(vb, w, h) {
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('viewBox', vb.join(' ')); s.setAttribute('width', w); s.setAttribute('height', h); s.setAttribute('class', 'ico');
  return s;
}
function unitIcon(u, px) {
  const s = icon([0, 0, TILE, TILE], px, px);
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', `unit p${Math.max(0, rp.order.indexOf(u.owner)) % 8}`);
  s.appendChild(g);
  if (!rp.board.art?.unit?.(u, g, { x: 0, y: 0, size: TILE, flip: false })) {
    const use = document.createElementNS(SVGNS, 'use');
    use.setAttribute('href', `#${spriteId(u.kind)}`); use.setAttribute('width', TILE); use.setAttribute('height', TILE);
    g.appendChild(use);
  }
  return s;
}
function tileIcon(st, x, y, px) {
  const id = terrainAt(st, x, y), d = rp.board.tmap[id] ?? {}, b = buildingsByTile(st).get(key(x, y));
  if (d.building && rp.board.art?.tile) {   // a building on its own, with the height it stands above its tile
    const s = icon([x * TILE, (y - 0.5) * TILE, TILE, 1.5 * TILE], px, px * 1.5);
    if (rp.board.art.tile(id, d, b?.owner ?? null, s, { x: x * TILE, y: y * TILE, size: TILE })) return s;
  }
  const s = icon([x * TILE, y * TILE, TILE, TILE], px, px);   // the board's own drawing of that tile (water joins and all)
  const use = document.createElementNS(SVGNS, 'use');
  use.setAttribute('href', '#board-terrain');
  s.appendChild(use);
  return s;
}
function tipNodes(st, x, y) {
  const u = unitsByTile(st).get(key(x, y)), b = buildingsByTile(st).get(key(x, y));
  const out = [];
  const text = (t, cls = '') => { const e = document.createElement('span'); e.textContent = t; if (cls) e.className = cls; return e; };
  if (u) {
    out.push(unitIcon(u, 22));
    // HP only with HP bars: otherwise the unit's own number already says it.
    if (rp?.board.hpBars) out.push(text(`${hpUnknown(u) ? '?' : displayHp(u)} HP`));
    const cargo = (u.cargo ?? []).map((id) => st.units[id]).filter(Boolean);
    if (cargo.length) {
      out.push(text('carrying', 'dim'));
      for (const c of cargo) {
        out.push(unitIcon(c, 18));
        if (hpUnknown(c) || displayHp(c) < 10) out.push(text(hpUnknown(c) ? '?' : `${displayHp(c)}`));
      }
    }
    out.push(text('on', 'dim'));
  }
  out.push(tileIcon(st, x, y, 22));
  const def = rp.data.terrain[terrainAt(st, x, y)]?.defense ?? 0;
  if (def) out.push(text('★'.repeat(def), 'stars'));
  if (b && b.capture < 20) out.push(text(`capture ${b.capture}/20`));
  out.push(text(`${x},${y}`, 'dim'));
  return out;
}
// Press and hold a unit, as on AWBW: where it can move (blue) until you let go; hold the same
// unit again for every tile it could fire on (red), and so on, alternating. libaw's engine works it out (pkg/, loaded on the first
// press), with its CO's power if one was used this turn.
let engine = null, sel = null, lastHold = null, didHold = false;   // lastHold: {id, phase} of the previous hold
const loadEngine = () => (engine ??= import('./pkg/libaw_wasm.js').then(async (m) => { await m.default(); return m; }));
// What the ghost shows from the engine (ranges, menus, damage boxes): without pkg/ it plays all
// the same, showing less.
// Before the first frame (setup waits up to 2.5 s for the engine): the timeline may still change
// then (menus of Wait alone dropped). An engine that arrives later only fills in what's shown.
async function ghostRanges(r, when = { early: false }) {
  const m = await loadEngine().catch(() => null);
  if (!m || r !== rp) return;
  const early = when.early;
  r.ghostEngine(m, { relayout: early });
  if (!early) renderAt(lastT);
}
function stateNow() {
  const st = structuredClone(rp.board.state);
  const i = segmentAt(rp.tl, lastT)?.seg.step ?? sb.steps.length;
  for (const s of sb.steps.slice(0, i + 1))
    if (s.type === 'power') { const p = st.players.find((p) => p.id === s.player); if (p) p.power = s.super ? 'S' : 'Y'; }
  return st;
}
async function select(x, y) {
  const u = unitsByTile(rp.board.state).get(key(x, y));
  clearSelection();
  if (!u) return;
  const m = await loadEngine().catch(() => null);
  const r = m && JSON.parse(m.reach(JSON.stringify(stateNow()), u.id));
  if (!r || r.error) return;
  const keys = (ps) => new Set(ps.map(([px, py]) => key(px, py)));
  const attack = keys(r.attack);
  const phase = lastHold?.id === u.id && lastHold.phase === 0 && attack.size ? 1 : 0;
  lastHold = { id: u.id, phase };
  sel = { id: u.id, at: key(u.x, u.y), move: keys(r.moves), attack, phase };
  showMarks();
}
function showMarks() {
  rp.marks = !sel ? {} : sel.phase && sel.attack.size ? { attack: sel.attack } : { move: sel.move };
  renderAt(lastT);
}
function clearSelection() {
  if (!sel) return;
  const was = sel; sel = null; rp.marks = {};
  return was;
}
// The selected unit moved or went (the turn is playing): its ranges no longer hold.
function checkSelection() {
  if (!sel) return;
  const u = Object.values(rp.board.state?.units ?? {}).find((v) => v.id === sel.id);
  if (!u || key(u.x, u.y) !== sel.at) clearSelection();
}
function hookTip() {
  rp.board.onHover = (t) => { tipAt = t; showTip(); };
  rp.board.onTile = (x, y) => {
    if (didHold) { didHold = false; tipAt = [x, y]; showTip(); return; }   // the click that ends a hold
    tipAt = tipAt && tipAt[0] === x && tipAt[1] === y ? null : [x, y]; showTip();
  };
}
await setup();
// Press and hold: ranges from the moment of the press, gone on release.
{
  const svg = $('board');
  let hold = null, pressed = false;
  let at = null;
  const release = () => {
    pressed = false; clearTimeout(hold);
    if (didHold && at) tipAt = at;   // the tip comes back where the hold was
    if (clearSelection()) renderAt(lastT); else showTip();
  };
  svg.addEventListener('pointerdown', (e) => {
    const t = rp.board.tileOf(e);
    if (!t || e.button > 0) return;
    loadEngine();
    pressed = true; didHold = false; at = t; clearTimeout(hold);
    hold = setTimeout(() => (didHold = true, select(t[0], t[1]).then(() => { if (!pressed) release(); })), 0);
  });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) svg.addEventListener(ev, release);
  svg.addEventListener('contextmenu', (e) => e.preventDefault());   // a long press on a phone
}
$('art').onchange = $('camera').onchange = $('anim').onchange = $('shoals').onchange = $('hp').onchange = setup;
$('scrub').oninput = () => { if (stop) { stop(); stop = null; $('btn-play').textContent = 'Play'; } renderAt((rp.duration * $('scrub').value) / 1000); };
$('btn-play').onclick = () => {
  if (stop) { stop(); stop = null; $('btn-play').textContent = 'Play'; return; }
  $('btn-play').textContent = 'Pause';
  stop = rp.play({ from: (rp.duration * $('scrub').value) / 1000, onEnd: () => { stop = null; $('btn-play').textContent = 'Play'; } });
};
// For a page that hosts this viewer and drives its clock: the timeline's segments
// ({t0, t1, step, phase}), the storyboard's steps, and the state before step i, so it can
// sync its own effects (sound, captions) to what is drawn.
// A still copy of the board laid over it while the new one is drawn underneath. A clone, so
// AWBW's hotlinked sprites stay drawn (an <img> of the SVG couldn't load them). It keeps its ids
// and goes before the board, so its references find its own definitions while the board redraws.
function snapshot() {
  const svg = $('board'), box = svg.getBoundingClientRect(), scr = $('screen').getBoundingClientRect();
  const c = svg.cloneNode(true);
  c.removeAttribute('id');
  Object.assign(c.style, { position: 'absolute', left: `${box.left - scr.left}px`, top: `${box.top - scr.top}px`,
    width: `${box.width}px`, height: `${box.height}px`, maxWidth: 'none', maxHeight: 'none', pointerEvents: 'none', transition: 'opacity .25s ease', zIndex: 1 });
  if (getComputedStyle($('screen')).position === 'static') $('screen').style.position = 'relative';
  $('screen').insertBefore(c, $('screen').firstChild);
  return c;
}
window.__replay = {
  get duration() { return rp.duration; }, renderAt, ready: true,
  get segments() { return rp.tl.segs; }, get steps() { return sb.steps; }, get start() { return sb.start; },
  // The ghost's pace (1 as planned, 0.5 twice as fast, 0 no ghost) for a page that's behind: the
  // timeline is laid out again; returns the time in it that shows what t showed, drawn there.
  // Kept for later storyboards (update).
  ghostPace(pace, t = lastT) { ghostPace = Math.max(0, pace); const n = rp.setGhostPace(ghostPace, t); renderAt(n); return n; },
  player: () => sb.player, stateBefore: (i) => rp.states[i],
  // A longer storyboard of the same turn (a game followed live): swap it in, drawn at t, without
  // reloading the page. Steps already shown keep their times unless a shot grew.
  // fade (ms): the old frame fades out over the new one (the next turn, where acted units brighten).
  async update(next, t = lastT, { fade = 0 } = {}) {
    const old = fade ? snapshot() : null;
    sb = next; await setup(t);
    if (old) requestAnimationFrame(() => { old.style.opacity = '0'; setTimeout(() => old.remove(), fade + 50); });
  },
};
</script>
</body>
</html>
