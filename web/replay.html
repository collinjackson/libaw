<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>libaw replay</title>
<link rel="stylesheet" href="style.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px system-ui, sans-serif; }
  .stage { max-width: 960px; margin: 16px auto; padding: 0 16px; }
  .screen { position: relative; overflow: hidden; border-radius: 12px; background: #10141c; }
  .screen svg { display: block; width: 100%; height: auto; }
  .controls { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  .controls input[type=range] { flex: 1; min-width: 120px; }
  .fx-hit { fill: #fff6b0; stroke: #ffb020; stroke-width: 3; }
  .fx-boom { fill: #ffb020; stroke: #e5603b; stroke-width: 4; }
  .fx-build { fill: none; stroke: #fff; stroke-width: 3; }
  .fx-shot { fill: #fff; stroke: #ffb020; stroke-width: 2; }
  .fx-flashw { fill: #fff; } .fx-ring { fill: none; stroke: #fff6b0; stroke-width: 4; }
  .fx-fire { fill: #ff8a1f; } .fx-core { fill: #fff3a0; } .fx-smoke { fill: #5a5550; }
  .fx-debris { fill: #2b2622; stroke: #ffb020; stroke-width: 1; }
  .fx-stem { fill: #e8701e; } .fx-cloud { fill: #ff9a2a; } .fx-cloud-cool { fill: #6d655d; }
  .fx-tracer { stroke: #ffe27a; stroke-width: 3; stroke-linecap: round; } .fx-puff { fill: #3d3a38; }
  .fx-billow { fill: #4a3d36; } .fx-crack { fill: none; stroke: #ff8a2a; stroke-width: 3; stroke-linecap: round; }
  .fx-spark { stroke: #ffe27a; stroke-width: 2.5; stroke-linecap: round; }
  .hpbar { fill: #0b0d12; opacity: .85; } .hpseg.hi { fill: #6fdc8c; } .hpseg.mid { fill: #f2d23a; } .hpseg.lo { fill: #ff6a4a; } .hpseg.off { fill: #3a3f4a; }
  .fx-dmg { fill: #fff; stroke: #000; stroke-width: 3; paint-order: stroke; font: 900 18px system-ui, sans-serif; text-anchor: middle; }
  .fx-cap { fill: #fff; stroke: #000; stroke-width: 3; paint-order: stroke; font: 900 15px system-ui, sans-serif; text-anchor: middle; }
  .fx-cap.done { fill: #f2b53a; font-size: 13px; }
  .fx-power-bar { fill: #000; }
  .fx-power { fill: #f2b53a; font: 900 30px system-ui, sans-serif; text-anchor: middle; }
  body.capture .stage { margin: 0; padding: 0; max-width: none; } body.capture .controls, body.capture .meta { display: none; }
  body.capture .screen { border-radius: 0; }
</style>
</head>
<body>
<div id="sprites" hidden></div>
<div class="stage">
  <p class="meta" id="meta">Loading…</p>
  <div class="screen" id="screen"><svg id="board"></svg></div>
  <div class="controls">
    <button id="btn-play">Play</button>
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <label><input id="camera" type="checkbox"> Follow the action</label>
    <select id="art"><option value="libaw">libaw art</option><option value="awbw">AWBW art</option></select>
    <label><input id="anim" type="checkbox" checked> Animate</label>
    <select id="shoals"><option value="custom">Custom shoals</option><option value="classic">Classic shoals</option></select>
    <label><input id="hp" type="checkbox"> HP bars</label>
  </div>
</div>
<script type="module">
import { Replay } from './js/replay.js';
import { awbwLook } from './js/look.js';

// ?sb=URL of a storyboard (awbw-replay --storyboard TURN.json), &art=libaw|awbw, &camera=1,
// &anim=0 (AWBW's still sprites), &shoals=custom|classic, &water=URL of a sea/shoal tile table
// (js/look.js; custom shoals need it), &hp=bars (segmented HP bars),
// &capture=1 (no controls; window.__replay.renderAt(t) for web/capture.mjs).
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
if (q.get('capture')) document.body.classList.add('capture');
if (!q.get('sb')) { $('meta').textContent = 'Add ?sb=URL of a storyboard (docs/storyboard.md).'; throw new Error('no storyboard'); }
const [units, terrain, tmap, sprites, sb] = await Promise.all([
  fetch('../data/units.json').then((r) => r.json()),
  fetch('../data/terrain.json').then((r) => r.json()),
  fetch('assets/terrain-map.json').then((r) => r.json()),
  fetch('assets/sprites.svg').then((r) => r.text()),
  fetch(q.get('sb')).then((r) => r.json()),
]);
$('sprites').innerHTML = sprites;
$('art').value = q.get('art') || 'libaw';
$('camera').checked = !!q.get('camera');
$('anim').checked = q.get('anim') !== '0';
$('shoals').value = q.get('shoals') === 'classic' ? 'classic' : 'custom';
$('hp').checked = q.get('hp') === 'bars';
const water = q.get('water') ? await fetch(q.get('water')).then((r) => r.json()).catch(() => null) : null;
const name = (id) => sb.names?.[id] ?? `Player ${id}`;

let rp, stop = null;
async function setup() {
  if (stop) stop();
  const art = $('art').value === 'awbw' ? awbwLook(sb, { animate: $('anim').checked, shoals: $('shoals').value, water }) : null;
  rp = new Replay($('board'), sb, { data: { units, terrain, tmap }, art, camera: $('camera').checked, hpBars: $('hp').checked });
  // AWBW's top-row sprites stand above the board: learn their heights before the first frame,
  // so the board (and a capture's frame size) has room for them from the start.
  await rp.board.measureArt(rp.states);
  $('meta').textContent = `Day ${sb.day}, ${name(sb.player)}'s turn: ${sb.steps.length} steps, ${rp.duration.toFixed(1)} s`;
  renderAt(0);
}
function renderAt(t) { rp.renderAt(t); $('scrub').value = Math.round((1000 * t) / rp.duration); }
await setup();
$('art').onchange = $('camera').onchange = $('anim').onchange = $('shoals').onchange = $('hp').onchange = setup;
$('scrub').oninput = () => { if (stop) { stop(); stop = null; $('btn-play').textContent = 'Play'; } renderAt((rp.duration * $('scrub').value) / 1000); };
$('btn-play').onclick = () => {
  if (stop) { stop(); stop = null; $('btn-play').textContent = 'Play'; return; }
  $('btn-play').textContent = 'Pause';
  stop = rp.play({ from: (rp.duration * $('scrub').value) / 1000, onEnd: () => { stop = null; $('btn-play').textContent = 'Play'; } });
};
// For a page that hosts this viewer and drives its clock: the timeline's segments
// ({t0, t1, step, phase}), the storyboard's steps, and the state before step i, so it can
// sync its own effects (sound, captions) to what is drawn.
window.__replay = {
  get duration() { return rp.duration; }, renderAt, ready: true,
  get segments() { return rp.tl.segs; }, get steps() { return sb.steps; }, get start() { return sb.start; },
  player: () => sb.player, stateBefore: (i) => rp.states[i],
};
</script>
</body>
</html>
