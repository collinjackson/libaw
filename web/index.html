<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>libaw play</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">◆</span> libaw <small>play</small></div>
    <div class="turninfo" id="turninfo">not connected</div>
    <div class="actions">
      <button id="btn-power" class="ghost" disabled title="CO power">CO Power</button>
      <button id="btn-super" class="ghost" disabled title="Super power">Super</button>
      <button id="btn-end" class="primary" disabled title="End turn (E)">End turn</button>
      <button id="btn-resign" disabled title="Resign this game">Resign</button>
      <button id="btn-theme" class="icon" title="Light / dark">◐</button>
    </div>
  </header>

  <main class="layout">
    <section class="boardwrap" id="boardwrap">
      <div class="empty" id="empty">
        <h2>Play a libaw game</h2>
        <p>Connect to a <code>libaw-server</code>, then create a game or join one. To play FlakBot, run
          <code>web/play_flakbot.sh</code> and open the link it prints.</p>
      </div>
      <svg id="board" class="board" hidden></svg>
      <div class="menu" id="menu" hidden></div>
      <div class="banner" id="banner" hidden></div>
    </section>

    <aside class="side">
      <div class="card" id="lobby">
        <h3>Game</h3>
        <label>Server <input id="server" value="ws://127.0.0.1:8765" spellcheck="false"></label>
        <div class="row"><button id="btn-connect" class="primary">Connect</button><span class="muted" id="connstatus"></span></div>
        <div id="lobby-in" hidden>
          <details open>
            <summary>New game</summary>
            <label>Map <select id="newstate"></select></label>
            <div class="row">
              <label class="inline">Days <input id="newdays" type="number" value="30" min="0" max="99"></label>
              <label class="inline"><input id="newfog" type="checkbox"> Fog</label>
              <label class="inline"><input id="newpowers" type="checkbox" checked> Powers</label>
            </div>
            <button id="btn-create">Create</button>
          </details>
          <h4>Open games <button id="btn-refresh" class="icon small" title="Refresh">↻</button></h4>
          <div id="games" class="games"></div>
        </div>
      </div>

      <div class="card" id="players-card" hidden>
        <h3 id="gametitle">Players</h3>
        <div id="players"></div>
        <div class="weather muted" id="weather"></div>
        <button id="btn-leave" class="ghost small">Leave game</button>
      </div>

      <div class="card" id="info-card" hidden>
        <h3>Tile</h3>
        <div id="info" class="info muted">Hover a tile.</div>
      </div>

      <div class="card">
        <h3>Log</h3>
        <ol id="log" class="log"></ol>
      </div>
      <p class="foot muted"><a href="parity.html">UI parity with AWBW</a> · original art, CC0 proposal</p>
    </aside>
  </main>
  <div id="sprites" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
