[package]
name = "libaw-replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The binary keeps its old name for now: local tools call it by that name.
[[bin]]
name = "awbw-replay"
path = "src/main.rs"

[dependencies]
libaw = { path = "../engine" }
serde_json = "1"
getrandom = "0.3"
rand_chacha = "0.9"
rand_core = "0.9"
ureq = { version = "3", features = ["json"] }
